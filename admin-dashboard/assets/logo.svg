<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D8A8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8A951;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0943D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0943D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8A951;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8D8A8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#goldGradient)" filter="url(#glow)"/>
  
  <!-- Inner Circle -->
  <circle cx="60" cy="60" r="48" fill="#1A1A1A"/>
  
  <!-- Leaf Symbol -->
  <g transform="translate(60, 60)">
    <!-- Main Leaf -->
    <path d="M0 -32 
             C18 -32, 30 -20, 30 0 
             C30 20, 18 32, 0 32 
             C-18 32, -30 20, -30 0 
             C-30 -20, -18 -32, 0 -32 Z" 
          fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Leaf Vein -->
    <path d="M0 -28 Q0 -10, 0 0 Q0 10, 0 28" 
          fill="none" stroke="url(#goldGradientDark)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Side Veins -->
    <path d="M-8 -20 Q-5 -15, 0 -10" 
          fill="none" stroke="url(#goldGradientDark)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M8 -20 Q5 -15, 0 -10" 
          fill="none" stroke="url(#goldGradientDark)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-8 10 Q-5 5, 0 0" 
          fill="none" stroke="url(#goldGradientDark)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M8 10 Q5 5, 0 0" 
          fill="none" stroke="url(#goldGradientDark)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-12 20 Q-8 15, 0 10" 
          fill="none" stroke="url(#goldGradientDark)" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
    <path d="M12 20 Q8 15, 0 10" 
          fill="none" stroke="url(#goldGradientDark)" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Center Dot -->
    <circle cx="0" cy="0" r="3" fill="url(#goldGradient)"/>
  </g>
  
  <!-- Decorative Ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#goldGradient)" stroke-width="1" opacity="0.3"/>
</svg>