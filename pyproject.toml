[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maison-hygia-backend"
version = "0.1.0"
description = "Maison Hygia Backend API"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "stripe>=15.0",
    "httpx>=0.28",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]

[tool.black]
line-length = 88
target-version = ["py310"]
