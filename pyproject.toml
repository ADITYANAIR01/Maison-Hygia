[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maison-hygia-backend"
version = "0.1.0"
description = "Maison Hygia Backend API"
requires-python = ">=3.10"

dependencies = [
    "alembic>=1.16",
    "boto3>=1.39",
    "fastapi>=0.141",
    "sqlalchemy>=2.0.52",
    "psycopg2-binary>=2.9",
    "pydantic>=2.13",
    "pydantic-settings>=2.11",
    "python-json-logger>=3.4",
    "razorpay>=2.0",
    "httpx>=0.28",
    "uvicorn>=0.52",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]

[tool.black]
line-length = 88
target-version = ["py310"]
