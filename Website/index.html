    <style>
      /* --- Search feature (custom, self-contained) --- */
      .mh-search-panel,
      .mh-search-results {
        position: fixed;
        top: 5rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        width: 100%;
        padding: 0 1rem;
        box-sizing: border-box;
      }
      .mh-search-panel {
        max-width: 28rem;
      }
      .mh-search-results {
        max-width: 48rem;
        max-height: 70vh;
        overflow-y: auto;
        background: var(--background);
        color: var(--foreground);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      }
      .mh-search-card {
        background: var(--background);
        color: var(--foreground);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        padding: 0.75rem;
      }
      .mh-search-form {
        display: flex;
        gap: 0.5rem;
      }
      .mh-search-input {
        flex: 1;
        min-width: 0;
        font: inherit;
        color: var(--foreground);
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        padding: 0.5rem 0.75rem;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .mh-search-input::placeholder {
        color: color-mix(in oklch, var(--foreground) 60%, transparent);
      }
      .mh-search-input:focus {
        border-color: transparent;
        box-shadow: 0 0 0 2px color-mix(in oklch, var(--gold) 40%, transparent);
      }
      .mh-search-submit {
        flex-shrink: 0;
        font: inherit;
        font-weight: 500;
        color: var(--cocoa);
        background: var(--gold);
        border: none;
        border-radius: 0.375rem;
        padding: 0.5rem 1rem;
        cursor: pointer;
        transition: background 0.2s;
      }
      .mh-search-submit:hover {
        background: color-mix(in oklch, var(--gold) 90%, black);
      }
      /* Search result cards */
      .mh-results-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
        padding: 1rem;
      }
      @media (min-width: 768px) {
        .mh-results-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      .mh-result-card {
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        background: none;
        cursor: pointer;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        overflow: hidden;
        transition: box-shadow 0.2s;
      }
      .mh-result-card:hover {
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      }
      .mh-result-card img {
        display: block;
        width: 100%;
        height: 12rem;
        object-fit: cover;
      }
      .mh-result-body {
        padding: 1rem;
      }
      .mh-result-name {
        font-weight: 600;
        color: var(--foreground);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .mh-result-desc {
        margin-top: 0.5rem;
        font-size: 0.875rem;
        color: color-mix(in oklch, var(--foreground) 60%, transparent);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .mh-result-price {
        margin-top: 0.75rem;
        font-weight: 500;
      }
      .mh-result-stock {
        margin-left: 0.5rem;
        color: var(--gold);
      }
      .mh-result-stock--out {
        color: color-mix(in oklch, var(--foreground) 50%, transparent);
      }
      .mh-results-empty {
        padding: 2rem;
        color: color-mix(in oklch, var(--foreground) 60%, transparent);
      }
      /* Live suggestions dropdown (just below the search box) */
      .mh-suggestions {
        margin-top: 0.5rem;
        max-height: 18rem;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: var(--background);
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      }
      .mh-suggestion {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        width: 100%;
        padding: 0.5rem 0.75rem;
        background: none;
        border: none;
        cursor: pointer;
        text-align: left;
        font: inherit;
        color: var(--foreground);
      }
      .mh-suggestion:hover {
        background: color-mix(in oklch, var(--gold) 12%, transparent);
      }
      .mh-suggestion img {
        width: 2.5rem;
        height: 2.5rem;
        flex-shrink: 0;
        object-fit: cover;
        border-radius: 0.375rem;
        background: color-mix(in oklch, var(--foreground) 6%, transparent);
      }
      .mh-suggestion-name {
        font-size: 0.9rem;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mh-suggestion-price {
        margin-left: auto;
        flex-shrink: 0;
        font-size: 0.875rem;
        color: var(--cocoa);
      }
      .mh-suggestions-empty {
        padding: 1rem;
        font-size: 0.875rem;
        color: color-mix(in oklch, var(--foreground) 60%, transparent);
      }
      /* Product detail view */
      .mh-product-view {
        position: fixed;
        top: 5rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 80;
        width: 100%;
        max-width: 56rem;
        max-height: 80vh;
        overflow-y: auto;
        padding: 0 1rem;
        box-sizing: border-box;
      }
      .mh-product-card {
        background: var(--background);
        color: var(--foreground);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 10px 10px -5px rgb(0 0 0 / 0.04);
        padding: 1.5rem;
      }
      .mh-product-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
      }
      .mh-product-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.75rem;
        line-height: 1.2;
      }
      .mh-product-close {
        background: none;
        border: none;
        cursor: pointer;
        color: color-mix(in oklch, var(--foreground) 70%, transparent);
        font-size: 1.75rem;
        line-height: 1;
        padding: 0.25rem;
        transition: color 0.2s;
      }
      .mh-product-close:hover {
        color: var(--foreground);
      }
      .mh-product-main {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
        margin-top: 1rem;
      }
      @media (min-width: 768px) {
        .mh-product-main {
          grid-template-columns: 1fr 1fr;
        }
      }
      .mh-product-image {
        width: 100%;
        border-radius: 0.5rem;
        object-fit: cover;
      }
      .mh-product-desc {
        margin-top: 0.75rem;
        font-size: 0.95rem;
        line-height: 1.7;
        color: color-mix(in oklch, var(--foreground) 70%, transparent);
      }
      .mh-product-price {
        margin-top: 1rem;
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.5rem;
      }
      .mh-product-stock {
        margin-left: 0.5rem;
        font-size: 0.875rem;
        color: var(--gold);
      }
      .mh-product-stock--out {
        color: color-mix(in oklch, var(--foreground) 50%, transparent);
      }
      .mh-similar-title {
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.25rem;
      }
      .mh-similar-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin-top: 0.75rem;
      }
      @media (min-width: 768px) {
        .mh-similar-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .mh-similar-card {
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        overflow: hidden;
        background: none;
        padding: 0;
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        transition: box-shadow 0.2s;
      }
      .mh-similar-card:hover {
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      }
      .mh-similar-card img {
        display: block;
        width: 100%;
        height: 8rem;
        object-fit: cover;
      }
      .mh-similar-body {
        padding: 0.75rem;
      }
      .mh-similar-name {
        font-size: 0.9rem;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mh-similar-price {
        margin-top: 0.25rem;
        font-size: 0.875rem;
        color: var(--cocoa);
      }
      .mh-product-add {
        margin-top: 1.25rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--gold);
        color: var(--cocoa);
        font: inherit;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: none;
        border-radius: 0.375rem;
        padding: 0.75rem 1.5rem;
        cursor: pointer;
        transition: background 0.2s, opacity 0.2s;
      }
      .mh-product-add:hover {
        background: color-mix(in oklch, var(--gold) 90%, black);
      }
      .mh-product-add:disabled {
        opacity: 0.7;
        cursor: default;
      }
      /* Full-screen search (opened with Enter / ?search= URL) */
      .mh-fullsearch {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: var(--background);
        overflow-y: auto;
        padding: 1.5rem 1rem 3rem;
        box-sizing: border-box;
      }
      .mh-fullsearch-card {
        max-width: 72rem;
        margin: 0 auto;
      }
      .mh-fullsearch-head {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 1rem 0;
        margin-bottom: 1.5rem;
        background: var(--background);
        border-bottom: 1px solid var(--border);
      }
      .mh-fullsearch-head .mh-search-form {
        flex: 1;
      }
      .mh-fullsearch-head .mh-search-input {
        font-size: 1.1rem;
        padding: 0.75rem 1rem;
      }
      .mh-fullsearch-close {
        background: none;
        border: none;
        cursor: pointer;
        color: color-mix(in oklch, var(--foreground) 70%, transparent);
        font-size: 2rem;
        line-height: 1;
        padding: 0 0.25rem;
        transition: color 0.2s;
      }
      .mh-fullsearch-close:hover {
        color: var(--foreground);
      }
      .mh-fullsearch-results .mh-results-grid {
        grid-template-columns: 1fr;
      }
      @media (min-width: 768px) {
        .mh-fullsearch-results .mh-results-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (min-width: 1024px) {
        .mh-fullsearch-results .mh-results-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      /* Header search icon — mirrors the Account icon styling */
      .mh-search-icon {
        display: none;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        padding: 0.5rem;
        color: color-mix(in oklch, var(--foreground) 70%, transparent);
        background: none;
        border: none;
        cursor: pointer;
        transition: color 0.2s;
      }
      .mh-search-icon:hover {
        color: var(--foreground);
      }
      @media (min-width: 768px) {
        .mh-search-icon {
          display: inline-flex;
        }
      }
    </style>

  <body class="bg-background text-foreground antialiased selection:bg-gold/20 selection:text-foreground">
    <div id="root"></div>

    <!-- Search Panel (shown when the search icon in the header is clicked) -->
    <div id="search-panel" class="mh-search-panel hidden">
      <div class="mh-search-card">
        <form id="search-form" class="mh-search-form">
          <input
            type="text"
            id="search-input"
            class="mh-search-input"
            placeholder="Search products, collections..."
          />
          <button type="submit" class="mh-search-submit">Search</button>
        </form>
        <div id="suggestions" class="mh-suggestions hidden"></div>
      </div>
    </div>

    <!-- Search Results Section -->
    <div id="search-results" class="mh-search-results hidden"></div>

    <!-- Product Detail View -->
    <div id="product-view" class="mh-product-view hidden"></div>

    <!-- Full-screen Search View -->
    <div id="fullsearch" class="mh-fullsearch hidden">
      <div class="mh-fullsearch-card">
        <div class="mh-fullsearch-head">
          <form id="fullsearch-form" class="mh-search-form">
            <input
              type="text"
              id="fullsearch-input"
              class="mh-search-input"
              placeholder="Search products, collections..."
            />
            <button type="submit" class="mh-search-submit">Search</button>
          </form>
          <button type="button" class="mh-fullsearch-close" id="fullsearch-close" aria-label="Close search">×</button>
        </div>
        <div id="fullsearch-results" class="mh-fullsearch-results"></div>
      </div>
    </div>

    <script>
      const searchPanel = document.getElementById('search-panel');
      const searchInput = document.getElementById('search-input');
      const searchResults = document.getElementById('search-results');
      const suggestions = document.getElementById('suggestions');
      const productView = document.getElementById('product-view');
      const fullSearch = document.getElementById('fullsearch');
      const fullSearchInput = document.getElementById('fullsearch-input');
      const fullSearchResults = document.getElementById('fullsearch-results');

      const imageCandidates = (slug) => [
        `/assets/${slug}.png`,
        `/assets/${slug}-2.png`,
        `/assets/${slug}-3.png`,
      ];

      const productImg = (slug, alt, cls) =>
        `<img src="${imageCandidates(slug)[0]}" data-srcs="${imageCandidates(slug).join(',')}" onerror="mhImgFallback(this)" alt="${alt}"${cls ? ` class="${cls}"` : ''} />`;

      window.mhImgFallback = (img) => {
        const list = (img.dataset.srcs || '').split(',');
        const idx = list.indexOf(img.getAttribute('src'));
        const next = list[idx + 1];
        if (next) {
          img.setAttribute('src', next);
        } else {
          img.onerror = null;
        }
      };

      const escapeHtml = (s) =>
        String(s ?? '').replace(/[&<>"']/g, (c) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        }[c]));

      const updateToggle = (open) => {
        const toggle = document.getElementById('search-toggle');
        if (toggle) toggle.setAttribute('aria-expanded', String(open));
      };

      const getBagSessionId = () => {
        let id = localStorage.getItem('mh_bag_session');
        if (!id) {
          id =
            (window.crypto && crypto.randomUUID && crypto.randomUUID()) ||
            'bag-' + Date.now() + '-' + Math.random().toString(36).slice(2);
          localStorage.setItem('mh_bag_session', id);
        }
        return id;
      };

      const addToBag = async (variantId, btn) => {
        btn.disabled = true;
        btn.textContent = 'Adding...';
        try {
          const res = await fetch('/cart/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              variant_id: variantId,
              quantity: 1,
              session_id: getBagSessionId(),
            }),
          });
          if (!res.ok) throw new Error('Add to bag failed');
          btn.textContent = 'Added to bag ✓';
        } catch (error) {
          console.error('Add to bag error:', error);
          btn.textContent = 'Error — try again';
          btn.disabled = false;
        }
      };

      // ----- Live suggestions while typing -----
      let debounceTimer = null;
      let suggestionCache = [];

      const fetchSuggestions = async (query) => {
        suggestions.classList.remove('hidden');
        suggestions.innerHTML = '<div class="mh-suggestions-empty">Searching...</div>';
        try {
          const res = await fetch(`/api/v1/products/?search=${encodeURIComponent(query)}&limit=8`);
          const data = await res.json();
          if (!data.items || data.items.length === 0) {
            suggestionCache = [];
            suggestions.innerHTML = '<div class="mh-suggestions-empty">No products found.</div>';
            return;
          }
          suggestionCache = data.items;
          suggestions.innerHTML = data.items
            .map(
              (p) => `
                <button type="button" class="mh-suggestion" data-id="${p.id}">
                  ${productImg(p.slug, '', '')}
                  <span class="mh-suggestion-name">${escapeHtml(p.name)}</span>
                  <span class="mh-suggestion-price">$${p.price}</span>
                </button>
              `
            )
            .join('');
          suggestions.querySelectorAll('.mh-suggestion').forEach((btn) => {
            btn.addEventListener('click', () => {
              const item = suggestionCache.find((p) => String(p.id) === btn.dataset.id);
              if (item) openProduct(item);
            });
          });
        } catch (error) {
          console.error('Suggestion error:', error);
          suggestions.innerHTML = '<div class="mh-suggestions-empty">Error searching. Please try again.</div>';
        }
      };

      searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        const query = searchInput.value.trim();
        if (!query) {
          suggestions.classList.add('hidden');
          suggestions.innerHTML = '';
          suggestionCache = [];
          return;
        }
        debounceTimer = setTimeout(() => fetchSuggestions(query), 250);
      });

      // ----- Product detail view with similar items -----
      const wordTokens = (s) =>
        String(s || '')
          .toLowerCase()
          .replace(/[^a-z0-9 ]/g, ' ')
          .split(/\s+/)
          .filter((w) => w.length > 2);

      const similarity = (a, b) => {
        const wa = wordTokens(a);
        const wb = wordTokens(b);
        return wa.filter((w) => wb.includes(w)).length;
      };

      const renderProductView = (detail, similar) => {
        const variant = detail.variants && detail.variants[0];
        const price = variant ? variant.price : null;
        const inv = variant ? variant.inventory_quantity : 0;
        const inStock = inv > 0;

        let similarHtml = '';
        if (similar.length) {
          similarHtml = `
            <h3 class="mh-similar-title">Similar items</h3>
            <div class="mh-similar-grid">
              ${similar
                .map(
                  (p) => `
                    <button type="button" class="mh-similar-card" data-id="${p.id}">
                      ${productImg(p.slug, escapeHtml(p.name), '')}
                      <div class="mh-similar-body">
                        <div class="mh-similar-name">${escapeHtml(p.name)}</div>
                        <div class="mh-similar-price">$${p.price}</div>
                      </div>
                    </button>
                  `
                )
                .join('')}
            </div>
          `;
        } else {
          similarHtml = '<p class="mh-results-empty">No similar items found yet.</p>';
        }

        productView.innerHTML = `
          <div class="mh-product-card">
            <div class="mh-product-head">
              <h2 class="mh-product-title">${escapeHtml(detail.name)}</h2>
              <button type="button" class="mh-product-close" id="product-close" aria-label="Close product">×</button>
            </div>
            <div class="mh-product-main">
              ${productImg(detail.slug, escapeHtml(detail.name), 'mh-product-image')}
              <div>
                <p class="mh-product-desc">${escapeHtml(detail.description || 'No description available.')}</p>
                <p class="mh-product-price">
                  ${price ? `$${price}` : 'Price on request'}
                  ${
                    inStock
                      ? '<span class="mh-product-stock">✓ In stock</span>'
                      : '<span class="mh-product-stock mh-product-stock--out">Out of stock</span>'
                  }
                </p>
                ${inStock && variant ? `<button type="button" class="mh-product-add" id="product-add">Add to bag</button>` : ''}
              </div>
            </div>
            ${similarHtml}
          </div>
        `;

        document.getElementById('product-close').addEventListener('click', closeProductView);

        const addBtn = document.getElementById('product-add');
        if (addBtn && variant) {
          addBtn.addEventListener('click', () => addToBag(variant.id, addBtn));
        }

        const similarItems = similar;
        productView.querySelectorAll('.mh-similar-card').forEach((btn) => {
          btn.addEventListener('click', () => {
            const item = similarItems.find((p) => String(p.id) === btn.dataset.id);
            if (item) openProduct(item);
          });
        });
      };

      const openProduct = async (product) => {
        searchPanel.classList.add('hidden');
        suggestions.classList.add('hidden');
        searchResults.classList.add('hidden');
        updateToggle(false);

        productView.classList.remove('hidden');
        productView.scrollTop = 0;
        productView.innerHTML = '<div class="mh-results-empty">Loading product...</div>';

        try {
          const detailRes = await fetch(`/api/v1/products/${product.id}`);
          if (!detailRes.ok) throw new Error('Product not found');
          const detail = await detailRes.json();

          const allRes = await fetch(`/api/v1/products/?limit=100`);
          const allData = await allRes.json();
          const similar = (allData.items || [])
            .filter((p) => p.id !== product.id)
            .map((p) => ({ ...p, score: similarity(detail.name, p.name) }))
            .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name))
            .slice(0, 6);

          renderProductView(detail, similar);
        } catch (error) {
          console.error('Product load error:', error);
          productView.innerHTML = '<div class="mh-results-empty">Error loading product. Please try again.</div>';
        }
      };

      const closeProductView = () => {
        productView.classList.add('hidden');
        productView.innerHTML = '';
      };

      // ----- Search toggle -----
      const toggleSearch = () => {
        const isHidden = searchPanel.classList.contains('hidden');
        searchPanel.classList.toggle('hidden');
        updateToggle(isHidden);
        if (isHidden) {
          searchInput.focus();
        } else {
          searchPanel.querySelector('form').reset();
          suggestions.classList.add('hidden');
          suggestions.innerHTML = '';
          suggestionCache = [];
          searchResults.classList.add('hidden');
        }
      };

      // Inject a small search icon into the header, just left of the Account icon.
      const searchIconSvg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">' +
        '<path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />' +
        '</svg>';

      const injectSearchIcon = () => {
        const accountLink = document.querySelector('a[aria-label="Account"]');
        if (!accountLink || document.getElementById('search-toggle')) return;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.id = 'search-toggle';
        btn.setAttribute('aria-label', 'Search products');
        btn.setAttribute('aria-expanded', 'false');
        btn.className = 'mh-search-icon';
        btn.innerHTML = searchIconSvg;
        accountLink.parentElement.insertBefore(btn, accountLink);
        btn.addEventListener('click', toggleSearch);
      };

      const observer = new MutationObserver(injectSearchIcon);
      observer.observe(document.body, { childList: true, subtree: true });
      injectSearchIcon();

      // ----- Full-screen search (Enter or ?search= URL) -----
      const renderFullResults = async (query) => {
        fullSearchResults.innerHTML = '<div class="mh-results-empty">Searching...</div>';
        try {
          const response = await fetch(`/api/v1/products/?search=${encodeURIComponent(query)}`);
          const data = await response.json();

          if (data.total === 0) {
            fullSearchResults.innerHTML = `<div class="mh-results-empty">No products found for &ldquo;${escapeHtml(query)}&rdquo;.</div>`;
            return;
          }

          const items = data.items;
          fullSearchResults.innerHTML = `
            <div class="mh-results-grid">
              ${items
                .map(
                  (product) => `
                    <button type="button" class="mh-result-card" data-id="${product.id}">
                      ${productImg(product.slug, escapeHtml(product.name), '')}
                      <div class="mh-result-body">
                        <h3 class="mh-result-name">${escapeHtml(product.name)}</h3>
                        <p class="mh-result-desc">${escapeHtml(product.description?.substring(0, 80) || '')}...</p>
                        <p class="mh-result-price">
                          <span>$${product.price}</span>
                          ${
                            product.inventory_quantity > 0
                              ? '<span class="mh-result-stock">✓ In stock</span>'
                              : '<span class="mh-result-stock mh-result-stock--out">Out of stock</span>'
                          }
                        </p>
                      </div>
                    </button>
                  `
                )
                .join('')}
            </div>
          `;

          fullSearchResults.querySelectorAll('.mh-result-card').forEach((card) => {
            card.addEventListener('click', () => {
              const item = items.find((p) => String(p.id) === card.dataset.id);
              if (item) openProduct(item);
            });
          });
        } catch (error) {
          console.error('Search error:', error);
          fullSearchResults.innerHTML = '<div class="mh-results-empty">Error performing search. Please try again.</div>';
        }
      };

      const showFullSearch = (query) => {
        fullSearchInput.value = query;
        fullSearchResults.scrollTop = 0;
        fullSearch.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        renderFullResults(query);
      };

      const openFullSearch = (query) => {
        const url = new URL(window.location.href);
        url.searchParams.set('search', query);
        window.history.pushState({ mhFullSearch: true }, '', url);
        showFullSearch(query);
      };

      const closeFullSearch = () => {
        fullSearch.classList.add('hidden');
        document.body.style.overflow = '';
        const url = new URL(window.location.href);
        if (url.searchParams.has('search')) {
          url.searchParams.delete('search');
          window.history.pushState({}, '', url);
        }
      };

      document.getElementById('fullsearch-close').addEventListener('click', closeFullSearch);

      document.getElementById('fullsearch-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const query = fullSearchInput.value.trim();
        if (!query) return;
        const url = new URL(window.location.href);
        url.searchParams.set('search', query);
        window.history.pushState({ mhFullSearch: true }, '', url);
        renderFullResults(query);
      });

      // Enter in the header search box -> transition to full-screen search
      const searchForm = document.getElementById('search-form');
      searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const query = searchInput.value.trim();
        if (!query) return;
        searchPanel.classList.add('hidden');
        suggestions.classList.add('hidden');
        updateToggle(false);
        closeProductView();
        openFullSearch(query);
      });

      // Restore the full-screen search from ?search= on load / back button
      window.addEventListener('popstate', () => {
        const query = new URLSearchParams(window.location.search).get('search');
        if (query) {
          showFullSearch(query);
        } else {
          fullSearch.classList.add('hidden');
          document.body.style.overflow = '';
        }
      });

      const initialQuery = new URLSearchParams(window.location.search).get('search');
      if (initialQuery) showFullSearch(initialQuery);

      // ----- Close on outside click / Escape -----
      document.addEventListener('click', (e) => {
        const toggle = document.getElementById('search-toggle');
        const panelOpen = !searchPanel.classList.contains('hidden');
        if (panelOpen && toggle && !searchPanel.contains(e.target) && !toggle.contains(e.target)) {
          searchPanel.classList.add('hidden');
          suggestions.classList.add('hidden');
          updateToggle(false);
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (!fullSearch.classList.contains('hidden')) {
          closeFullSearch();
          return;
        }
        if (!productView.classList.contains('hidden')) {
          closeProductView();
          return;
        }
        searchPanel.classList.add('hidden');
        suggestions.classList.add('hidden');
        updateToggle(false);
      });
    </script>
  </body>
</html>
